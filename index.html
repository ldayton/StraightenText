<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straighten Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 44px 24px 24px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 24px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            margin-top: 20px;
        }

        .form-group:first-of-type {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: #666;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: #007AFF;
        }

        textarea[readonly] {
            background: #f5f5f5;
            cursor: default;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .calculate-btn:active {
            background: #0056b3;
        }

        .notification {
            text-align: center;
            color: #007AFF;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Straighten Text</h1>
        <p style="text-align: center; color: #555; margin-bottom: 20px; font-size: 14px; font-weight: 500;">Replaces curly quotes and apostrophes with their straight versions</p>

        <div class="form-group">
            <label for="inputText">Input Text</label>
            <textarea id="inputText" rows="3"></textarea>
        </div>

        <button class="calculate-btn" onclick="calculate()">Straighten Text</button>

        <div class="form-group">
            <label for="outputText">Output Text</label>
            <textarea id="outputText" rows="3" readonly></textarea>
        </div>

        <button class="calculate-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        <div class="notification" id="copyNotification">Copied to clipboard!</div>
    </div>

    <script>
        function straighten(text) {
            // Replace curly quotes with straight quotes
            text = text.replaceAll("“", '"');
            text = text.replaceAll("”", '"');
            text = text.replaceAll("‘", "'");
            text = text.replaceAll("’", "'");
            return text;
        }

        function calculate() {
            const inputText = document.getElementById('inputText').value;
            const straightenedText = straighten(inputText);
            document.getElementById('outputText').value = straightenedText;
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText').value;
            const notification = document.getElementById('copyNotification');

            navigator.clipboard.writeText(outputText).then(() => {
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            });
        }
    </script>
</body>
</html>
